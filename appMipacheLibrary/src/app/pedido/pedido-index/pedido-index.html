<div class="pedido-container">
  <h2>Listado de Pedidos</h2>

  <!-- Botón para ir al formulario de registro -->
  <div class="acciones">
    <button [routerLink]="['/pedido/create']" class="btn-registrar">
      Registrar nuevo pedido
    </button>
  </div>

  <table *ngIf="pedidos.length > 0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Cliente</th>
        <th>Estado</th>
        <th>Fecha</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let pedido of pedidos">
        <td>{{ pedido?.id ?? 'Sin ID' }}</td>
        <td>{{ pedido?.cliente }}</td>
        <td>{{ pedido?.estado }}</td>
        <td>{{ pedido?.fecha | date: 'dd/MM/yyyy' }}</td>
        <button matMiniFab 
            aria-label="Detalle pedido" class="btn-primary"
              (click)="detallePedido(pedido.id)">
              <mat-icon class="mat-18">info</mat-icon>
        </button>
      </tr>
    </tbody>
  </table>

  <p *ngIf="pedidos.length === 0">No hay pedidos registrados.</p>
</div>
