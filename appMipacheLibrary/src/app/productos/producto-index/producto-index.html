<div class="grid-container">
  <mat-card appearance="outlined" class="filter">
    <mat-card-header><h1 class="mat-h1">Productos</h1></mat-card-header>
    <mat-card-content>
      <mat-form-field class="full-width">
        <mat-label>Nombre Producto</mat-label>
        <input matInput />
        <mat-hint> /20</mat-hint>
        <button mat-icon-button matSuffix color="primary">
          <mat-icon>search</mat-icon>
        </button>
      </mat-form-field>
      <mat-form-field class="full-width">
        <mat-label>Categorias</mat-label>
        <mat-select multiple>
          <mat-option></mat-option>
        </mat-select>
      </mat-form-field>
    </mat-card-content>
  </mat-card>
  <div class="product-list">
    <div class="product-card">
      <mat-card appearance="outlined">
        <mat-card-header class="secondary-title title">
          <mat-card-title> </mat-card-title>
        </mat-card-header>
        <img mat-card-image [src]="'http://localhost:3000/images/'" [alt]="" />
        <mat-card-content class="content">
          <div class="price"></div>
        </mat-card-content>
        <mat-card-footer class="footer">
          <button
            matMiniFab
            matTooltip="Detalle Producto"
            aria-label="Detalle Producto"
            class="bg-primary"
          >
            <mat-icon class="mat-18">info</mat-icon>
          </button>
          <button
            matMiniFab
            matTooltip="Comprar"
            aria-label="Comprar"
            class="bg-secondary"
          >
            <mat-icon class="mat-18">add_shopping_cart</mat-icon>
          </button>
        </mat-card-footer>
      </mat-card>
    </div>
  </div>
</div>
