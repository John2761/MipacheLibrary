<div class="library-container">
  <!-- Encabezado -->
  <div class="library-header">
    <h1 class="library-title">LIBROS</h1>
    <p class="library-subtitle">
      Historias que dejan huella.
      <span class="resaltado">Libros excepcionales para lectores únicos.</span>
    </p>
  </div>

  <div class="admin-button-container">
      <button
        mat-raised-button
        color="primary"
        [routerLink]="['/producto-admin']"
      >
        Mantenimiento
      </button>
    </div>
    <div class="custom-button-container">
       <button
        mat-raised-button
        color="primary"
        [routerLink]="['/personalizado/create']"
      >
        Agregar personalizado
      </button>
    </div>

  <div class="library-body">
    <!-- FILTROS LATERALES -->
    <aside class="library-filters">
      <div class="filter-box">
        <h3 class="filter-title">Filtrar por</h3>
        <ul class="filter-list">
          <li class="filter-option">Categorías</li>
          <li class="filter-option">Precio</li>
          <li class="filter-option">Idioma</li>
          <li class="filter-option">Formato</li>
        </ul>
      </div>
    </aside>

    <!-- LISTADO DE LIBROS -->
    <section class="library-grid">
      <mat-card
        class="product-card"
        *ngFor="let item of datos; trackBy: trackById"
        [routerLink]="['/producto', item.id]"
        style="cursor: pointer"
      >
        <img
          mat-card-image
          [src]="'http://localhost:3000/images/' + item.imagenPrincipal"
          alt="Imagen de {{ item.nombre }}"
          (error)="item.imagenPrincipal = 'image-not-found.jpg'"
        />
        <!-- hacer que funcione el clic de detalle -->

        <mat-card-content>
          <h3 class="card-title">{{ item.nombre }}</h3>
          <p class="card-author">{{ item.autor }}</p>
          <p class="card-price">₡{{ item.precio | number: '1.0-0' }}</p>
        </mat-card-content>
      </mat-card>
    </section>
  </div>
</div>
