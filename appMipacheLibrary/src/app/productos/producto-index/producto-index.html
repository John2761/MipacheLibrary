<div class="grid-container">
  <mat-card appearance="outlined" class="filter">
    <mat-card-header><h1 class="mat-h1">Productos</h1></mat-card-header>
    <mat-card-content>
      <mat-form-field class="full-width">
        <mat-label>Nombre Producto</mat-label>
        <input matInput />
        <mat-hint> /20</mat-hint>
        <button mat-icon-button matSuffix color="primary">
          <mat-icon>Search</mat-icon>
        </button>
      </mat-form-field>
      <mat-form-field class="full-width">
        <mat-label>Categorias</mat-label>
        <mat-select multiple>
          <mat-option></mat-option>
        </mat-select>
      </mat-form-field>
    </mat-card-content>
  </mat-card>
  @if(datos){
  <div class="product-list">
    @for (item of datos; track item.id) {
    <div class="product-card">
      <mat-card appearance="outlined">
        <mat-card-header class="secondary-title title">
          <mat-card-title> {{item.nombre}} 
          </mat-card-title>

        </mat-card-header>
        <img 
        mat-card-image 
        [src]="'http://localhost:3000/images/'+ item.imagenPrincipal" 
        [alt]="'image-not-found.jpg'" 
        />
        <mat-card-content class="content">
          <p>{{item.descripcion}}</p>
          <div class="price"> {{item.precio |currency: "CRC"}}</div>
        </mat-card-content>
        
        <mat-card-footer class="footer">
          <button
            matMiniFab
            matTooltip="Detalle Producto"
            aria-label="Detalle Producto"
            class="bg-primary"
            (click)="detalle(item.id)"
          >
            <mat-icon class="mat-18">info</mat-icon>
          </button>
          <button
            matMiniFab
            matTooltip="Comprar"
            aria-label="Comprar"
            class="bg-secondary"
          >
            <mat-icon class="mat-18">add_shopping_cart</mat-icon>
          </button>
        </mat-card-footer>
      </mat-card>
    </div>
  }
  </div>
}
