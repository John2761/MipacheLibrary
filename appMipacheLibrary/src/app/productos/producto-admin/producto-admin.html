<div class="admin-list">
  <div class="admin-list__header">
    <h1>Administrar Productos</h1>
    <button matMiniFab aria-label="Crear Producto" (click)="crearProducto()">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2 tabla-admin" matSort matSortStart="desc">
    <!-- Nombre -->
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
      <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
    </ng-container>

    <!-- Precio -->
    <ng-container matColumnDef="precio">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio</th>
      <td mat-cell *matCellDef="let row">₡{{ row.precio | number:'1.0-0' }}</td>
    </ng-container>

    <!-- Estado (si usas p.activo) -->
    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let p">
        <span class="chip" [ngClass]="p.activo ? 'chip--success' : 'chip--muted'">
          {{ p.activo ? 'ACTIVO' : 'INACTIVO' }}
        </span>
      </td>
    </ng-container>

    <!-- Acciones -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let p" class="acciones">
        <button mat-icon-button color="primary" matTooltip="Editar" (click)="actualizarProducto(p.id)">
          <mat-icon>edit</mat-icon>
        </button>
        
    <!-- Dar de baja / reactivar -->
        <button mat-icon-button [color]="p.activo ? 'warn' : 'accent'"
                (click)="toggleActivo(p)" [matTooltip]="p.activo ? 'Dar de baja' : 'Reactivar'">
          <mat-icon>{{ p.activo ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator class="producto-paginator"
                 [length]="dataSource.data.length || 0"
                 [pageIndex]="0"
                 [pageSize]="10"
                 [pageSizeOptions]="[10,15,20]">
  </mat-paginator>
</div>
