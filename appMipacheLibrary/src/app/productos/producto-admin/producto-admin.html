<mat-card> 
  <!-- Titulo del Card -->
  <mat-card-header>
    <mat-card-title>Listado de Productos</mat-card-title>
    <mat-card-subtitle>
      <button matMiniFab  aria-label="Crear Producto" class="btn-primary"
        (click)="crearProducto()">
        <mat-icon>add</mat-icon>
      </button>
    </mat-card-subtitle>
  </mat-card-header>
  
  <mat-card-content>
    <hr />
    <!-- Table -->
    <div class="mat-elevation-z8">
      <mat-table mat-table [dataSource]="dataSource" class="tabla" matSort matSortStart="desc"
        aria-label="Elements">
        
        <!-- Columna nombre -->
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
          <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
        </ng-container>

        <!-- Columna precio -->
        <ng-container matColumnDef="precio">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio</th>
          <td mat-cell *matCellDef="let row">{{ row.precio }}</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Opciones</th>
          <td mat-cell *matCellDef="let row">
            <button matIconButton 
            matTooltip="Actualizar Producto" 
            aria-label="Actualizar Producto" class="btn-primary"
            (click)="actualizarProducto(row.id)">
              <mat-icon class="mat-18">edit</mat-icon>
            </button>
            <button matMiniFab 
            matTooltip="Detalle Producto" 
            aria-label="Detalle Producto" class="btn-primary"
              (click)="detalleProducto(row.id)">
              <mat-icon class="mat-18">info</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="header-row bg-tertiary"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="content-row"></tr>
      </mat-table>

      <mat-paginator #paginator [length]="dataSource.data.length" [pageIndex]="0" [pageSize]="5"
        [pageSizeOptions]="[3, 5, 10]" 
        >
      </mat-paginator>
    </div>

  </mat-card-content>
</mat-card>
