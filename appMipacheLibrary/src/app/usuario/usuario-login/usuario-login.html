<form [formGroup]="formulario"  novalidate>
  <mat-card class="card-content">
    <mat-card-header>
      <mat-card-title class="title">Login Usuario </mat-card-title>
    </mat-card-header> 
    <mat-card-content>
      <div class="row">
        <div class="col">
          <mat-form-field class="full-width">
            <mat-label>Correo</mat-label>
            <input matInput type="text" placeholder="Correo electrónico" formControlName="correo" />
            @if (errorHandling('correo')) {
              <mat-error>
                {{errorHandling('correo')}}
              </mat-error>
            }
          </mat-form-field>
        </div>
      </div>
      <div class="row">
        <div class="col">
          <mat-form-field class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hide ? 'password' : 'text'" placeholder="Password usuario" formControlName="password" />
          <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
            <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          @if (errorHandling('password')) {
            <mat-error>
              {{errorHandling('password')}}
            </mat-error>
          }
        </mat-form-field>
        </div>
      </div>
    </mat-card-content>
    <mat-card-actions>
      <button matButton="outlined" class="btn-secondary" (click)="submitForm()">Login</button>
      <button matButton="outlined" class="btn-tertiary" type="reset" (click)="onReset()">Cancelar</button>
    </mat-card-actions>
  </mat-card>
  </form>
