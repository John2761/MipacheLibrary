<div class="login-wrapper">
  <form [formGroup]="formulario" novalidate class="login-form">
    <mat-card class="login-card">

      <!-- Columna izquierda: branding -->
      <div class="login-side">
        <img src="/images/logo.jpg" alt="Mipache Library" class="login-logo" />
        <h2>¡Bienvenida/o!</h2>
        <p>Ingresa tus credenciales para continuar.</p>
      </div>

      <!-- Columna derecha: formulario -->
      <div class="login-main">
        <h1 class="login-title">Login Usuario</h1>

        <mat-form-field class="full" appearance="outline">
          <mat-label>Correo</mat-label>
          <input matInput type="email" placeholder="correo@dominio.com" formControlName="correo" />
          @if (errorHandling('correo')) { <mat-error>{{ errorHandling('correo') }}</mat-error> }
        </mat-form-field>

        <mat-form-field class="full" appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput [type]="hide ? 'password' : 'text'" placeholder="••••••••" formControlName="password" />
          <button mat-icon-button type="button" matSuffix (click)="hide = !hide">
            <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          @if (errorHandling('password')) { <mat-error>{{ errorHandling('password') }}</mat-error> }
        </mat-form-field>

        <div class="actions">
          <button mat-flat-button color="primary" (click)="submitForm()">
            <mat-icon fontIcon="login"></mat-icon> Login
          </button>
          <button mat-stroked-button type="reset" (click)="onReset()">Cancelar</button>
        </div>
      </div>
    </mat-card>
  </form>
</div>
