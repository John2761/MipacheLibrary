<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mipache Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    :root {
      --beige: #f1e9d9;
      --verde-oliva: #6f7a53;
      --marron: #c89267;
      --gris: #5e5e5e;
      --crema: #f6e7c8;
      --verde-bosque: #475f3c;
    }

    body {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      background-color: #f1e9d9;
      color: #5e5e5e;
    }

    header {
      background-color: #6f7a53;
      padding: 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-family: 'Merriweather', serif;
      font-size: 28px;
    }

    nav a {
      margin: 0 15px;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      padding: 60px 20px;
      text-align: center;
      background-color: #f6e7c8;
    }

    .hero h2 {
      font-family: 'Merriweather', serif;
      font-size: 36px;
      color: #6f7a53;
    }

    .hero p {
      font-size: 18px;
      max-width: 600px;
      margin: 20px auto;
    }

    .hero button {
      background-color: #c89267;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .hero button:hover {
      background-color: #6f7a53;
    }

    footer {
      background-color: #475f3c;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mipache Library</h1>
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Catálogo</a>
      <a href="#">Nosotros</a>
      <a href="#">Contacto</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Bienvenido a Mipache Library</h2>
    <p>Descubre un mundo de libros y mucho más. Explora nuestra colección y encuentra tu próxima gran lectura.</p>
    <button>Explorar Catálogo</button>
  </section>

  <footer>
    &copy; 2025 Mipache Library - Todos los derechos reservados.
  </footer>
</body>
</html>
